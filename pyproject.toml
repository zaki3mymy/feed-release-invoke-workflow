[project]
name = "feed-release"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "freezegun>=1.5.5",
    "pook>=2.1.4",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-watcher>=0.6.2",
    "ruff>=0.14.10",
    "ty>=0.0.8",
]

# linter / formatter
[tool.ruff]
line-length = 100
indent-width = 4
[tool.ruff.lint]
# Generated by RuffMate at 2026-01-03T12:51:35.005Z
# https://zaki3mymy.github.io/RuffMate/
# Ruff version: 0.14.10
select = ["ALL"]
ignore = [
    "D400",  # docstringの1行目にピリオド不要
    "D415",  # docstringの1行目にピリオド不要
    "INP001",  # Lambda関数に__init__.pyを作りたくないので
    "S310",  # 外部からの入力がURLのスキームになることはないので除外
    "TC003",  # 軽いスクリプトなので型チェックのみのimportもOK
]
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
[tool.ruff.lint.isort]
known-first-party = []

# type-checker
[tool.ty.src]
include = ["src", "tests"]
exclude = []

# test
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--cov src --cov-branch --cov-report term-missing --cov-report xml --cov-report html"
