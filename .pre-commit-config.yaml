# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: mixed-line-ending
        args: [--fix=lf]

-   repo: local
    hooks:
    -   id: lint
        name: Lint Python files
        entry: uv run ruff check
        language: python
        types: [file, python]
        exclude: ^(tests/|scripts/).*$

    -   id: type-check
        name: Type check Python files
        entry: uv run ty check
        language: python
        types: [file, python]
        exclude: ^(tests/|scripts/).*$

    -   id: aws-credential-check
        name: Check for AWS credentials
        entry: git secrets --scan
        language: system
        types: [text]

    -   id: terraform-docs-modules
        name: Check terraform docs(modules)
        entry: terraform-docs markdown table --output-check terraform/modules/feed-release/
        args: [--indent=2, --output-mode=inject, --output-file=README.md]
        language: system
        files: ^terraform/modules/.*\.tf$
        pass_filenames: false

    -   id: terraform-docs-environments
        name: Check terraform docs(environments)
        entry: terraform-docs markdown table --output-check terraform/environments/production/
        args: [--indent=2, --output-mode=inject, --output-file=README.md]
        language: system
        files: ^terraform/environments/production/.*\.tf$
        pass_filenames: false

default_install_hook_types: [pre-commit]
