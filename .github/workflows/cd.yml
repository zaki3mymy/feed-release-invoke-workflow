name: CD

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'terraform/**'
      - 'pyproject.toml'
      - '.github/workflows/cd.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'production'
        type: choice
        options:
        - production

env:
  AWS_REGION: "ap-northeast-1"

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to AWS
    environment: ${{ github.event.inputs.environment || 'production' }}

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Install uv
      uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f # v4
      with:
        enable-cache: true

    - name: Install dependencies
      run: uv sync --dev

    - name: Run tests before deployment
      run: uv run pytest --cov-report=term

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
      with:
        terraform_version: "~1.9.0"

    - name: Create dist directory
      run: mkdir -p dist

    - name: Write repositories config
      run: echo '${{ secrets.REPOSITORIES_JSON }}' > terraform/environments/production/repositories.json

    - name: Terraform Init
      run: |
        cd terraform/environments/production
        terraform init \
          -backend-config="bucket=${{ secrets.TERRAFORM_STATE_BUCKET }}" \
          -backend-config="key=feed-release/terraform.tfstate" \
          -backend-config="region=${{ env.AWS_REGION }}"

    - name: Terraform Apply
      run: |
        cd terraform/environments/production
        terraform apply \
          -var="github_token=${{ secrets.GH_TOKEN_FOR_DISPATCH }}" \
          -auto-approve

    - name: Test Lambda deployment
      env:
        REPOSITORIES_JSON: ${{ secrets.REPOSITORIES_JSON }}
      run: |
        echo "$REPOSITORIES_JSON" | jq -c '.[]' | while read -r repo; do
          name=$(echo "$repo" | jq -r '.name')
          echo "Testing Lambda with repository: $name"

          aws lambda invoke \
            --function-name feed-release \
            --payload "$repo" \
            --cli-binary-format raw-in-base64-out \
            response.json

          echo "Response for $name:"
          cat response.json
          echo ""
        done

    - name: Cleanup
      run: rm -f response.json
      if: always()
